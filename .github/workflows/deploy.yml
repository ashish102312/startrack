name: Deployment Check

on:
  workflow_dispatch:

jobs:
  pre-deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Environment Files
        run: |
          test -f client/.env.example || exit 1
          test -f server/.env.example || exit 1
          echo "Environment templates validated."
